name: build-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t nagios-ci:${{ github.run_id }} .

      - name: Start container
        run: docker run -d --name nagios-ci-${{ github.run_id }} nagios-ci:${{ github.run_id }}

      - name: Smoke test
        run: |
          expected=$(sed -n 's/^ENV NAGIOS_BRANCH *nagios-//p' Dockerfile)
          bash tests/smoke.sh nagios-ci-${{ github.run_id }} "$expected"

      - name: Migration test (volumes from jasonrivers/nagios)
        run: bash tests/migrate.sh nagios-ci:${{ github.run_id }}

      - name: Container logs
        if: failure()
        run: |
          docker logs nagios-ci-${{ github.run_id }} || true
          docker exec nagios-ci-${{ github.run_id }} tail -50 /opt/nagios/var/nagios.log || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f nagios-ci-${{ github.run_id }} || true
          docker rmi nagios-ci:${{ github.run_id }} || true

  publish:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=$(sed -n 's/^ENV NAGIOS_BRANCH *nagios-//p' Dockerfile)
          docker build -t "$image:latest" -t "$image:$version" .
          docker push "$image:latest"
          docker push "$image:$version"
